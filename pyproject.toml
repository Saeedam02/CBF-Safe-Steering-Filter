[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbf-safe-steering"
version = "1.0.0"
description = "A visual high-order Control Barrier Function safety filter for collision-free steering."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Saeed Aghamohammadi"}]
keywords = [
  "control-barrier-functions",
  "hocbf",
  "autonomous-vehicles",
  "quadratic-programming",
  "robotics",
  "safety-critical-systems",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "pillow>=9.4",
]

[project.urls]
Homepage = "https://github.com/Saeedam02/CBF-Safe-Steering-Filter"
Repository = "https://github.com/Saeedam02/CBF-Safe-Steering-Filter"
Issues = "https://github.com/Saeedam02/CBF-Safe-Steering-Filter/issues"

[project.optional-dependencies]
dev = [
  "black>=24.3",
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
cbf-steering-demo = "cbf_safe_steering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["cbf_safe_steering"]
omit = [
  "src/cbf_safe_steering/cli.py",
  "src/cbf_safe_steering/visualization.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
